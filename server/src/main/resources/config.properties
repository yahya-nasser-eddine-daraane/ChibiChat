# LAN Messenger Auth Server — Configuration
# Copy this file next to your .jar and fill in your values.

# ── HTTP Server ───────────────────────────────────────────────
server.port=8080

# ── SQL Server Connection ─────────────────────────────────────
# Use localhost if SQL Server runs on the same machine as this server.
# Use the machine's LAN IP (e.g. 192.168.1.10) if it's on another machine.
db.host=localhost
db.port=1433
db.name=LanMessenger
db.username=sa
db.password=*********

# ── Notes ─────────────────────────────────────────────────────
# Make sure SQL Server has TCP/IP enabled:
#   SQL Server Configuration Manager → SQL Server Network Configuration
#   → Protocols for MSSQLSERVER → TCP/IP → Enabled
#
# If using SQL Server Express, the instance name is SQLEXPRESS:
#   db.host=localhost\\SQLEXPRESS
#
# Run schema.sql once before starting the server:
#   sqlcmd -S localhost -U sa -P YourPassword -i schema.sql
